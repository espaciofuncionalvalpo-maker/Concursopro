<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>ConcursoPro</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .pack { background: #0f172a; border: 2px solid #334155; color: #f8fafc; border-radius: 10px; padding: 10px; font-weight: 700; cursor: pointer; }
    .pack.active { border-color: #10b981; background: rgba(16,185,129,0.15); }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 15px; }
    button.main { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; background: #10b981; color: #052e16; margin-top: 4px; }
    button.gold { background: #f59e0b; color: #1f1300; }
    .item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="tituloConcurso">Gran Concurso Oficial</h1>
    <div id="resumen">Ventas: 0 · Tickets: 0 · Recaudado: $0</div>
  </div>

  <div class="card">
    <strong>Nueva Venta</strong>
    <div class="packs" id="listaPacks"></div>
    <input id="nombre" placeholder="Nombre completo" />
    <input id="rut" placeholder="RUT (ej: 18.456.789-2)" />
    <input id="fono" placeholder="WhatsApp (+569...)" />
    <button class="main" onclick="registrarVenta()">Confirmar pago y generar ticket</button>
    <div id="ventasBox"></div>
  </div>

  <div class="card">
    <strong>Premios y Sorteo</strong>
    <input id="premioInput" placeholder="Nombre del premio (ej: Giftcard $50.000)" />
    <button class="main gold" onclick="agregarPremio()">Agregar premio</button>
    <div id="premiosBox"></div>
    <button class="main gold" onclick="sortear()">Sortear ganador ahora</button>
    <div id="ganadorBox" class="item">Sin ganador aún</div>
  </div>

  <script>
    const KEY = 'concursopro_fast_v1';
    const PACKS = [
      { qty: 1, price: 2000 },
      { qty: 3, price: 5000 },
      { qty: 8, price: 10000 }
    ];
    let selectedPack = 2;
    let state = { sales: [], tickets: [], prizes: [], winner: null };
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && Array.isArray(saved.tickets)) state = saved;
    } catch (_) {}

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
      render();
    }

    function makeCode(n) {
      return 'CN-' + String(n).padStart(4, '0') + Math.random().toString(36).slice(2, 4).toUpperCase();
    }

    function registrarVenta() {
      const name = document.getElementById('nombre').value.trim();
      const rut = document.getElementById('rut').value.trim();
      const fono = document.getElementById('fono').value.trim();
      if (!name || !rut) return alert('Completa nombre y RUT.');
      const pack = PACKS[selectedPack];
      const codes = [];
      for (let i = 0; i < pack.qty; i++) {
        const code = makeCode(state.tickets.length + 1);
        codes.push(code);
        state.tickets.push({ code, name, rut, fono });
      }
      state.sales.unshift({ name, rut, fono, qty: pack.qty, amount: pack.price, codes });
      document.getElementById('nombre').value = '';
      document.getElementById('rut').value = '';
      document.getElementById('fono').value = '';
      save();
      alert('Tickets generados: ' + codes.join(', '));
    }

    function agregarPremio() {
      const p = document.getElementById('premioInput').value.trim();
      if (!p) return alert('Escribe un premio.');
      state.prizes.push(p);
      document.getElementById('premioInput').value = '';
      save();
    }

    function sortear() {
      if (!state.tickets.length) return alert('No hay tickets vendidos todavía.');
      if (!state.prizes.length) return alert('Agrega al menos un premio primero.');
      const idx = Math.floor(Math.random() * state.tickets.length);
      const win = state.tickets[idx];
      const premio = state.prizes[state.prizes.length - 1];
      state.winner = { premio, ...win };
      save();
    }

    function render() {
      const totalMoney = state.sales.reduce((acc, s) => acc + s.amount, 0);
      document.getElementById('resumen').textContent =
        `Ventas: ${state.sales.length} · Tickets: ${state.tickets.length} · Recaudado: $${totalMoney.toLocaleString('es-CL')}`;

      document.getElementById('listaPacks').innerHTML = PACKS.map((p, i) =>
        `<button type="button" class="pack ${i === selectedPack ? 'active' : ''}" onclick="selectedPack=${i};render();">x${p.qty}<br>$${p.price.toLocaleString('es-CL')}</button>`
      ).join('');

      document.getElementById('ventasBox').innerHTML = state.sales.slice(0, 10).map(s =>
        `<div class="item"><strong>${s.name}</strong> (${s.rut}) · x${s.qty} ($${s.amount.toLocaleString('es-CL')})<br>Códigos: ${s.codes.join(', ')}</div>`
      ).join('');

      document.getElementById('premiosBox').innerHTML = state.prizes.map((p, i) =>
        `<div class="item">${i + 1}. ${p}</div>`
      ).join('');

      document.getElementById('ganadorBox').innerHTML = state.winner
        ? `<strong>Ganador:</strong> ${state.winner.name} (${state.winner.rut})<br><strong>Código:</strong> ${state.winner.code} · <strong>Premio:</strong> ${state.winner.premio}`
        : 'Sin ganador aún';
    }

    render();
  </script>
</body>
</html>
